<!DOCTYPE html>
<html>
<head>
    <title>Student Grading System</title>
</head>

<body>

    <div class="container">
        <h2>Student Grading System</h2>

        <form>
            <label>Student Name:</label><br>
            <input type="text" id="name"><br>

            <label>Marks:</label><br>
            <input type="number" id="marks"><br>

            <input type="button" value="Calculate Grade" onclick="gradeSystem()">
        </form>
    </div>

    <script>
        function gradeSystem() {

            var name = document.getElementById("name").value;
            var marks = document.getElementById("marks").value;

            if(name == "") {
                alert("Please enter student name.");
                return;
            }

            if(marks == "") {
                alert("Please enter marks.");
                return;
            }

            marks = Number(marks);

            if(marks < 0 || marks > 100) {
                alert("Marks should be between 0 and 100.");
                return;
            }

            var grade;
            var result;

            if(marks >= 90){
                grade = "A+";
                result = "Pass";
            }
            else if(marks >= 80){
                grade = "A";
                result = "Pass";
            }
            else if(marks >= 70){
                grade = "B";
                result = "Pass";
            }
            else if(marks >= 60){
                grade = "C";
                result = "Pass";
            }
            else if(marks >= 50){
                grade = "D";
                result = "Pass";
            }
            else if(marks >= 40){
                grade = "E";
                result = "Pass";
            }
            else{
                grade = "F";
                result = "Fail";
            }

            document.write("<h2>Student Grade Report</h2>");
            document.write("<hr>");
            document.write("<b>Student Name:</b> " + name + "<br><br>");
            document.write("<b>Marks:</b> " + marks + "<br><br>");
            document.write("<b>Grade:</b> " + grade + "<br><br>");
            document.write("<b>Result:</b> " + result);
        }
    </script>

</body>
</html>
