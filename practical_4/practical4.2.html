<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Vehicle Number Validator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input {
      padding: 10px;
      width: 250px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Indian Vehicle Number Validator</h2>
    <input type="text" id="vehicleNumber" placeholder="Enter vehicle number (e.g., MH12AB1234)">
    <button onclick="validateNumber()">Check</button>
    <p id="result"></p>
  </div>

  <script>
    function validateNumber() {
      const number = document.getElementById("vehicleNumber").value.trim();
      const result = document.getElementById("result");

      // Regex for Indian vehicle number: AA00AA0000
      const regex = /^[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}$/;

      if (regex.test(number)) {
        result.textContent = "✅ Valid Vehicle Number";
        result.style.color = "green";
      } else {
        result.textContent = "❌ Invalid Vehicle Number";
        result.style.color = "red";
      }
    }
  </script>
</body>
</html>
