<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Programs | Sejal Lende</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header .student-info {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .program-card {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #e0e7ff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .program-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .program-card h2 {
            color: #5a67d8;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .program-card h2 span {
            background: #667eea;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
            background: white;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #edf2ff;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .result strong {
            color: #5a67d8;
        }

        .result p {
            margin-top: 5px;
            font-size: 18px;
            color: #2d3748;
            word-break: break-word;
        }

        .footer {
            text-align: center;
            margin-top: 10px;
            color: #718096;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Student Details -->
        <div class="header">
            <h1>✨ String Manipulation Programs</h1>
            <div class="student-info">
                Sejal Lende &nbsp;|&nbsp; PRN: 24070521035
            </div>
        </div>

        <!-- Program 1: Reverse a String -->
        <div class="program-card">
            <h2><span>1</span> Reverse a String</h2>
            <label for="stringInput">Enter a string:</label>
            <input type="text" id="stringInput" placeholder="Type something here...">
            <button class="btn" onclick="reverseString()">Reverse String</button>
            
            <div class="result" id="reverseResult">
                <strong>Reversed String:</strong>
                <p id="reversedText"></p>
            </div>
        </div>

        <!-- Program 2: Count Vowels -->
        <div class="program-card">
            <h2><span>2</span> Count Number of Vowels</h2>
            <label for="paragraphInput">Enter a paragraph:</label>
            <textarea id="paragraphInput" placeholder="Write or paste a paragraph here..."></textarea>
            <button class="btn" onclick="countVowels()">Count Vowels</button>
            
            <div class="result" id="vowelResult">
                <strong>Total Vowels Found:</strong>
                <p id="vowelCount"></p>
            </div>
        </div>

        <div class="footer">
            Created by <strong>Sejal Lende</strong> (PRN: 24070521035)
        </div>
    </div>

    <script>
        // Program 1: Reverse a String
        function reverseString() {
            const input = document.getElementById("stringInput").value;
            const reversed = input.split("").reverse().join("");
            
            document.getElementById("reversedText").textContent = reversed || "(empty string)";
            document.getElementById("reverseResult").classList.add("show");
        }

        // Program 2: Count number of vowels in a paragraph
        function countVowels() {
            const text = document.getElementById("paragraphInput").value;
            const vowels = "aeiouAEIOU";
            let count = 0;

            for (let i = 0; i < text.length; i++) {
                if (vowels.includes(text[i])) {
                    count++;
                }
            }

            document.getElementById("vowelCount").textContent = count;
            document.getElementById("vowelResult").classList.add("show");
        }

        // Optional: Allow Enter key to trigger reverse
        document.getElementById("stringInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") reverseString();
        });
    </script>
</body>
</html>
